services:
  - type: web
    name: lyftr-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEYS
        sync: false
      - key: DEFAULT_MODEL
        value: gemini/gemini-2.0-flash
      - key: CACHE_ENABLED
        value: "true"
      - key: ENABLE_FAILURE_SIMULATION
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
